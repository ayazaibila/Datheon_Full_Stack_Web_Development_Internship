<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskflow | Productivity workspace</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><a class="brand" href="../index.html">Task<span>flow</span></a><div class="date" id="today"></div></header><section class="intro"><div><p class="eyebrow">Good morning, Aya</p><h1>Make space for<br><em>what matters.</em></h1></div><div class="progress"><div class="progress-ring"><strong id="progress-value">0%</strong></div><span>Daily progress</span></div></section><section class="workspace"><aside><button class="add-button" id="open-form">＋ New task</button><nav class="filters" aria-label="Task filters"><button class="filter active" data-filter="all">All tasks <b id="all-count">0</b></button><button class="filter" data-filter="active">In progress <b id="active-count">0</b></button><button class="filter" data-filter="completed">Completed <b id="completed-count">0</b></button></nav><p class="label">Categories</p><div class="category-list"><button class="category active" data-category="all"><i class="dot all-dot"></i>All categories</button><button class="category" data-category="Work"><i class="dot work"></i>Work</button><button class="category" data-category="Personal"><i class="dot personal"></i>Personal</button><button class="category" data-category="Study"><i class="dot study"></i>Study</button></div></aside><section class="tasks"><div class="task-toolbar"><div><h2 id="list-title">All tasks</h2><p id="list-summary">Your personal command center</p></div><label class="search">⌕ <input id="search" placeholder="Search tasks..." aria-label="Search tasks"></label></div><div id="task-list" class="task-list"></div><div id="empty" class="empty" hidden><span>✦</span><h3>No tasks here yet</h3><p>Create a task and make your next move intentional.</p></div></section></section></main><dialog id="task-dialog"><form method="dialog" id="task-form"><button type="button" class="close" id="close-form">×</button><p class="eyebrow">New focus</p><h2 id="form-title">Create a task</h2><input type="hidden" id="task-id"><label>Task title<input id="task-title" required maxlength="100" placeholder="What needs your attention?"></label><div class="form-grid"><label>Category<select id="task-category"><option>Work</option><option>Personal</option><option>Study</option></select></label><label>Due date<input id="task-due" type="date"></label></div><button class="add-button" type="submit">Save task</button></form></dialog><script src="script.js"></script></body></html>
